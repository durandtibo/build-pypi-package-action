# Workflow testing the action from the current repository code (uses: ./),
# i.e. the version that is not released yet, on Linux, macOS, and Windows.
# It builds the throwaway packages of test/fixtures/: the success path (every
# OS, every Python version), edge cases (dotted package name, dynamic version,
# stale dist/, plain version outside manual runs, import name different from the
# distribution name) and the failure paths (failing
# build, invalid metadata, unimportable package, already-published version,
# plain or post-release version on a manual run, missing metadata fields, packaged
# .env file, local version, broken entry point). Failure jobs also assert the
# failed-check output, i.e. that the action failed for the expected reason.
# Safe to run on every push/PR: no publishing or signing involved.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Build the fixture package on every OS (Linux, macOS, Windows)
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # The build-package action assumes the package it builds lives at the
      # repo root (pyproject.toml), so stage the fixture
      # there for the duration of this job.
      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          artifact-name: dist-local-${{ matrix.os }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # Build the fixture package with every Python version of the config
  build-python:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}
          artifact-name: dist-local-python-${{ matrix.python-version }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # build-package must fail closed when the build command itself errors
  # out, before it ever gets to the metadata/publish checks.
  reject-build-failure:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-build-failure/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (build errors out)" "${OUTCOME}"
          assert_failed_check build "${FAILED_CHECK}"

  # build-package must fail closed when the package name/version it built
  # is already published on PyPI, regardless of how it was triggered.
  reject-already-published-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # This fixture claims to be "requests" 2.31.0, a name/version already
      # published on PyPI, so the action's "already published" check should
      # reject it before it ever gets to the smoke test.
      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-published/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (already-published version)" "${OUTCOME}"
          assert_failed_check published "${FAILED_CHECK}"

  # build-package must reject workflow_dispatch runs that target a plain
  # release version instead of a dev/pre-release one. This check is only
  # exercised when the workflow is dispatched manually.
  reject-plain-version-on-manual-run:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-plain-version/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (manual run, plain release version)" "${OUTCOME}"
          assert_failed_check manual-version "${FAILED_CHECK}"

  # The manual-run guard is a whitelist: a post-release (9.9.9.post1) is not a
  # pre-release and must be rejected too. Only exercised on manual dispatch.
  reject-post-version-on-manual-run:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-post-version/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (manual run, post-release version)" "${OUTCOME}"
          assert_failed_check manual-version "${FAILED_CHECK}"

  # A distribution name with dots/hyphens must be normalized to its module name
  # (pypi_release_action_fixture) by the smoke test.
  dotted-package-name:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-dotted-name/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          artifact-name: dist-local-dotted-package-name

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi.release-action.fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # A dynamic version (resolved by the build backend) must be extracted and built.
  dynamic-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-dynamic-version/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          artifact-name: dist-local-dynamic-version

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # dist/ content from a previous build must never leak into the artifact.
  stale-dist-is-cleared:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Create stale files in dist/
        shell: bash
        run: |
          mkdir dist
          touch dist/stale-0.0.0-py3-none-any.whl dist/stale-0.0.0.tar.gz dist/SHA256SUMS

      - name: Run build-package action
        id: build
        uses: ./
        with:
          artifact-name: dist-local-stale-dist-is-cleared

      - name: Assert stale files are gone and dist/ was rebuilt
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built
          test ! -e dist/stale-0.0.0-py3-none-any.whl
          test ! -e dist/stale-0.0.0.tar.gz
          test ! -e dist/SHA256SUMS
          assert_dist_artifact

  # The import name is detected from the wheel: the module (fixture_alt) is not
  # derived from the distribution name (pypi-release-action-fixture-alt). Without the
  # detection the smoke test would import pypi_release_action_fixture_alt and fail.
  import-name-detected:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-import-name/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          artifact-name: dist-local-import-name-detected

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture-alt" "0.0.1a1"
          assert_dist_built

  # An explicit import-name wins over the detection.
  import-name-explicit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-import-name/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          import-name: fixture_alt
          artifact-name: dist-local-import-name-explicit

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # A wrong explicit import-name must fail the smoke test: it overrides the detection.
  reject-wrong-import-name:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-import-name/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./
        with:
          import-name: not_the_module

      - name: Assert build-package action failed at the expected check
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (wrong import-name)" "${OUTCOME}"
          assert_failed_check smoke-wheel "${FAILED_CHECK}"

  # build-package must fail closed on a wheel without Requires-Python (pip would install it on unsupported Pythons).
  reject-missing-metadata-fields:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-no-requires-python/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed at the expected check
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (a wheel without Requires-Python)" "${OUTCOME}"
          assert_failed_check metadata-fields "${FAILED_CHECK}"

  # build-package must fail closed on a package that ships a .env file.
  reject-unwanted-files:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-secret-file/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed at the expected check
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (a package that ships a .env file)" "${OUTCOME}"
          assert_failed_check unwanted-files "${FAILED_CHECK}"

  # build-package must fail closed on a local version (1.0.0+local), which PyPI rejects.
  reject-local-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-local-version/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed at the expected check
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (a local version)" "${OUTCOME}"
          assert_failed_check local-version "${FAILED_CHECK}"

  # build-package must fail closed on a console script that does not resolve to an importable object.
  reject-bad-entry-point:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-bad-entry-point/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed at the expected check
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (a console script that does not resolve to an importable object)" "${OUTCOME}"
          assert_failed_check entry-points "${FAILED_CHECK}"

  # The smoke test must fail closed when a package builds but cannot be imported.
  reject-import-failure:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-import-failure/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed at the expected stage
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (wheel cannot be imported)" "${OUTCOME}"
          assert_failed_check smoke-wheel "${FAILED_CHECK}"

  # `twine check --strict` must reject distributions with invalid metadata.
  reject-invalid-metadata:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-invalid-metadata/. .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed at the expected stage
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (metadata rejected by twine)" "${OUTCOME}"
          assert_failed_check twine "${FAILED_CHECK}"

  # The pre-release requirement only applies to manual runs: a plain release
  # version that is not on PyPI must be accepted on any other trigger.
  accept-plain-version-outside-manual-run:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-plain-version/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          artifact-name: dist-local-accept-plain-version

      - name: Assert plain release version was accepted
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "pypi-release-action-fixture" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "9.9.9"
          assert_dist_built

  # Verification just inspects already-built, OS-independent files
  # (wheel and sdist), so one runner is enough regardless of which
  # OS produced each artifact.
  verify-artifact:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-local-${{ matrix.os }}
          path: dist/

      - name: Assert dist artifact contains the expected files
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_artifact
