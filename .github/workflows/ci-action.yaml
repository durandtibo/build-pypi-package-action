# Workflow testing the action from the current repository code (uses: ./),
# i.e. the version that is not released yet, on Linux, macOS, and Windows.
# It builds the throwaway packages of test/fixtures/ and is structured as:
#   - build, build-python: the success path (every OS, every Python version);
#   - accept: a table of packages that must build (dotted name, dynamic version,
#     stale dist/, import name different from the distribution name);
#   - reject, reject-manual, reject-tag-mismatch: tables of packages that must be
#     rejected, with the failed-check id that the rejection must carry;
#   - verify-artifact: the uploaded artifacts hold exactly the wheel and the sdist.
# A new case is a new row in a table. The same tables are in
# nightly-test-released.yaml, which tests the last release; add the row there once a
# release has the feature. Safe to run on every push/PR: no publishing or signing.
#
# Cases that depend on the trigger cannot be reproduced by a PR job:
#   - reject-manual and the manual `accept-plain-version-outside-manual-run`
#     counterpart need `workflow_dispatch` (run ci-action.yaml or ci.yaml by hand);
#   - reject-tag-mismatch needs a tag ref (run the workflow by hand on a tag with
#     `gh workflow run ci.yaml --ref <tag>`); all the other jobs are skipped there.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Build the fixture package on every OS (Linux, macOS, Windows)
  build:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # The build-package action assumes the package it builds lives at the
      # repo root, so stage the fixture there for the duration of this job.
      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          artifact-name: dist-local-${{ matrix.os }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # Build the fixture package with every Python version of the config
  build-python:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}
          artifact-name: dist-local-python-${{ matrix.python-version }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # Packages that must build. Each row is a case; `stale` first fills dist/ with stale files, which must
  # be gone afterwards; `import-name` is passed to the action.
  accept:
    name: accept (${{ matrix.case }})
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        include:
          - case: dotted-name
            fixture: pkg-dotted-name
            name: pypi.release-action.fixture
            version: 0.0.1a1
          - case: dynamic-version
            fixture: pkg-dynamic-version
            name: pypi-release-action-fixture
            version: 0.0.1a1
          - case: stale-dist
            fixture: pkg
            name: pypi-release-action-fixture
            version: 0.0.1a1
            stale: true
          - case: import-name-detected
            fixture: pkg-import-name
            name: pypi-release-action-fixture-alt
            version: 0.0.1a1
          - case: import-name-explicit
            fixture: pkg-import-name
            name: pypi-release-action-fixture-alt
            version: 0.0.1a1
            import-name: fixture_alt
          # docs/ sorts first and cannot be imported: the distribution name must win
          - case: import-name-matches-distribution
            fixture: pkg-multi-module
            name: pypi-release-action-fixture-multi
            version: 0.0.1a1
          # _helper/ sorts first and cannot be imported: private names are skipped
          - case: import-name-skips-private
            fixture: pkg-private-module
            name: pypi-release-action-fixture-private
            version: 0.0.1a1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      - name: Create stale files in dist/
        if: matrix.stale
        shell: bash
        run: |
          mkdir dist
          touch dist/stale-0.0.0-py3-none-any.whl dist/stale-0.0.0.tar.gz dist/SHA256SUMS

      - name: Run build-package action
        id: build
        uses: ./
        with:
          import-name: ${{ matrix.import-name }}
          artifact-name: dist-local-accept-${{ matrix.case }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
          EXPECTED_NAME: ${{ matrix.name }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "${EXPECTED_NAME}" "${EXPECTED_VERSION}"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

      # dist/ content from a previous build must never leak into the artifact.
      - name: Assert stale files are gone
        if: matrix.stale
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_stale_dist_cleared

  # Packages that must be rejected. `expected` is the failed-check id of the check that must fail.
  reject:
    name: reject (${{ matrix.case }})
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: build-failure
            fixture: pkg-build-failure
            expected: build
          - case: invalid-metadata
            fixture: pkg-invalid-metadata
            expected: twine
          - case: already-published
            fixture: pkg-published
            expected: published
          - case: import-failure
            fixture: pkg-import-failure
            expected: smoke-wheel
          - case: no-requires-python
            fixture: pkg-no-requires-python
            expected: metadata-fields
          - case: secret-file
            fixture: pkg-secret-file
            expected: unwanted-files
          - case: local-version
            fixture: pkg-local-version
            expected: local-version
          - case: bad-entry-point
            fixture: pkg-bad-entry-point
            expected: entry-points
          - case: wrong-import-name
            fixture: pkg-import-name
            expected: smoke-wheel
            import-name: not_the_module
          - case: ambiguous-import-name
            fixture: pkg-ambiguous-import
            expected: import
          # `stage` runs a helper of scripts/test-helper.sh before the action
          - case: oversized-file
            fixture: pkg
            expected: size
            stage: oversized
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      - name: Stage an oversized file in the package
        if: matrix.stage == 'oversized'
        shell: bash
        run: |
          source scripts/test-helper.sh
          stage_oversized_file pypi_release_action_fixture

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./
        with:
          import-name: ${{ matrix.import-name }}

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"

  # Manual runs must publish a pre-release only; the guard is a whitelist, so a post release is rejected too.
  # Only exercised when the workflow is dispatched manually.
  reject-manual:
    name: reject-manual (${{ matrix.case }})
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: plain-version
            fixture: pkg-plain-version
            expected: manual-version
          - case: post-version
            fixture: pkg-post-version
            expected: manual-version
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"

  # The pre-release requirement only applies to manual runs: a plain release version that is not on PyPI must be accepted
  # on any other trigger.
  accept-plain-version-outside-manual-run:
    if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-plain-version/. .

      - name: Run build-package action
        id: build
        uses: ./
        with:
          artifact-name: dist-local-accept-plain-version

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "9.9.9"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # The tag must be exactly v + the package version (v0.0.1a1 for the fixture). Only exercised on a tag ref other
  # than that one.
  reject-tag-mismatch:
    name: reject-tag-mismatch (${{ matrix.case }})
    if: github.ref_type == 'tag' && github.ref_name != 'v0.0.1a1'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: tag-mismatch
            fixture: pkg
            expected: tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: ./

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"

  # Verification just inspects already-built, OS-independent files (wheel and sdist), so one runner is enough
  # regardless of which OS produced each artifact.
  verify-artifact:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-local-${{ matrix.os }}
          path: dist/

      - name: Assert dist artifact contains the expected files
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_artifact
