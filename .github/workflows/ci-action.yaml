# Workflow testing the action. One file tests both the current checkout and the last release,
# so the two cannot drift (see review/testing.md of cancel-queued-runs-action):
#   - use-released: false (ci.yaml): the action from this checkout (`uses: ./`), i.e. the
#     version that is not released yet, and every row of test/cases.json;
#   - use-released: true (nightly.yaml): the last stable release
#     (durandtibo/build-pypi-package-action@v0.1.2), and only the rows marked "released": true.
# Each job has two action steps, `local` and `released`, guarded by `if`, and one verify step
# that reads `steps.local.outputs.x || steps.released.outputs.x`.
# Update the version in this header and in the `uses:` refs below when a new version is
# released, then flip `released` to true for its features in test/cases.json.
#
# The tests build the throwaway packages of test/fixtures/ and check the contract and the
# wiring (inputs, outputs, failed-check ids), not the logic of the steps. They are split in
# two groups:
#   - general behaviour, on the full matrix (every OS of os_matrix, Linux, macOS and
#     Windows, and every standard Python version): test, the default usage. It is the only job
#     that crosses the matrix, which bounds the cost: with workflow-config-action v0.3.1 that is
#     18 OS x 5 Python versions = 90 cells per run, the same on pull requests, pushes and the
#     schedule;
#   - edge cases, on one runner: accept (packages that must build), reject, reject-manual,
#     reject-tag-mismatch (packages that must be rejected, with the failed-check id that the
#     rejection must carry), test-sign-compat (the artifact is accepted by sign-pypi-package-action),
#     accept-plain-version-outside-manual-run, and test-export (the
#     action run from the exported archive, i.e. what a release ships).
# A new case is a new row in test/cases.json, not a new job.
# Safe to run on every push/PR: no publishing or signing.
#
# Cases that depend on the trigger cannot be reproduced by a PR job:
#   - reject-manual and the manual `accept-plain-version-outside-manual-run`
#     counterpart need `workflow_dispatch` (run ci-action.yaml or ci.yaml by hand);
#   - reject-tag-mismatch needs a tag ref (run the workflow by hand on a tag with
#     `gh workflow run ci.yaml --ref <tag>`); all the other jobs are skipped there.

name: Test Action
on:
  workflow_call:
    inputs:
      use-released:
        description: "Test the last stable release instead of the code of this checkout"
        required: false
        default: false
        type: boolean
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
  workflow_dispatch: # to trigger manually
    inputs:
      use-released:
        description: "Test the last stable release instead of the code of this checkout"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # The test matrix is loaded here when the workflow is run alone (workflow_dispatch); a caller
  # passes it down instead.
  get-matrix:
    if: ${{ inputs.test-matrix == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  # Matrices of the accept and reject jobs, from test/cases.json (every row, or only the rows
  # with "released": true when the last release is tested).
  cases:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accept: ${{ steps.load.outputs.accept }}
      reject: ${{ steps.load.outputs.reject }}
      reject-manual: ${{ steps.load.outputs.reject-manual }}
      reject-tag-mismatch: ${{ steps.load.outputs.reject-tag-mismatch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Load cases
        id: load
        shell: bash
        env:
          MODE: ${{ inputs.use-released && 'released' || 'all' }}
        run: scripts/load-cases.sh "${MODE}"

  # General behaviour: build the fixture package with the default usage on every OS and every
  # Python version, check the outputs and that the uploaded artifact holds only the wheel and
  # the sdist.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [get-matrix, cases]
    if: ${{ !cancelled() && !failure() && github.ref_type != 'tag' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).python_versions_standard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # The build-package action assumes the package it builds lives at the
      # repo root, so stage the fixture there for the duration of this job.
      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}
          artifact-name: dist-${{ matrix.os }}-${{ matrix.python-version }}

      - name: Run build-package action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/build-pypi-package-action@ade1f9b224bd9bb90b4f551dfe3abbb1409f3782 # ratchet:durandtibo/build-pypi-package-action@v0.1.2
        with:
          python-version: ${{ matrix.python-version }}
          artifact-name: dist-${{ matrix.os }}-${{ matrix.python-version }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.local.outputs.package-name || steps.released.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.local.outputs.package-version || steps.released.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert hashes output
        shell: bash
        env:
          HASHES: ${{ steps.local.outputs.hashes || steps.released.outputs.hashes }}
        run: |
          source scripts/test-helper.sh
          assert_hashes "${HASHES}"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built false

      # Replace the local dist/ with the uploaded artifact: it is what a publish job downloads.
      - name: Remove the local dist/
        shell: bash
        run: rm -rf dist

      # The artifact service can answer "not found" for a moment after the upload is finalized
      # (seen on macos-15), so the first download is retried once after a pause.
      - name: Download dist artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

      - name: Wait before retrying the download
        if: ${{ steps.download.outcome == 'failure' }}
        shell: bash
        run: sleep 20

      - name: Download dist artifact (retry)
        if: ${{ steps.download.outcome == 'failure' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

      - name: Assert dist artifact contains the expected files
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_artifact

  # What consumers get is what is tested: run the action from the exported archive, not from the
  # checkout, so a file marked export-ignore by mistake fails here. Only the code of this checkout
  # is concerned: the released action is what consumers already get.
  test-export:
    if: ${{ !inputs.use-released && github.ref_type != 'tag' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Extract the exported archive
        shell: bash
        run: |
          mkdir .exported-action
          git archive --worktree-attributes HEAD | tar x -C .exported-action

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action (exported)
        id: exported
        uses: ./.exported-action
        with:
          artifact-name: dist-export

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.exported.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.exported.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

  # Edge cases, packages that must build. Each row is a case; `stale` first fills dist/ with stale
  # files, which must be gone afterwards; `import-name` is passed to the action. The OS does not
  # change how these cases are handled (the test job covers every OS), so one runner is enough.
  accept:
    name: accept (${{ matrix.case }})
    needs: cases
    if: ${{ github.ref_type != 'tag' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.cases.outputs.accept) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      - name: Create stale files in dist/
        if: matrix.stale
        shell: bash
        run: |
          mkdir dist
          touch dist/stale-0.0.0-py3-none-any.whl dist/stale-0.0.0.tar.gz dist/SHA256SUMS

      - name: Run build-package action (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          import-name: ${{ matrix.import-name }}
          checksum-file: ${{ matrix.checksum-file || 'false' }}
          artifact-name: dist-accept-${{ matrix.case }}

      - name: Run build-package action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/build-pypi-package-action@ade1f9b224bd9bb90b4f551dfe3abbb1409f3782 # ratchet:durandtibo/build-pypi-package-action@v0.1.2
        with:
          import-name: ${{ matrix.import-name }}
          artifact-name: dist-accept-${{ matrix.case }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.local.outputs.package-name || steps.released.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.local.outputs.package-version || steps.released.outputs.package-version }}
          EXPECTED_NAME: ${{ matrix.name }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "${EXPECTED_NAME}" "${EXPECTED_VERSION}"

      - name: Assert dist/ was built
        shell: bash
        env:
          CHECKSUM_FILE: ${{ matrix.checksum-file || 'false' }}
        run: |
          source scripts/test-helper.sh
          assert_dist_built "${CHECKSUM_FILE}"

      # dist/ content from a previous build must never leak into the artifact.
      - name: Assert stale files are gone
        if: matrix.stale
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_stale_dist_cleared

  # The SHA256SUMS file must be accepted by durandtibo/sign-pypi-package-action (its steps 1.2 to
  # 1.4: tag, file name format, file set, checksums). Signing and releasing have side effects, so
  # the job has no `id-token: write`: the signer passes its checksum checks, then stops at its
  # permission check (failed-check `permissions`). Any other id means that it rejected the artifact.
  # Only the code of this checkout is concerned: the last release still writes `./` prefixes.
  test-sign-compat:
    name: test-sign-compat
    if: ${{ !inputs.use-released && github.ref_type != 'tag' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action (local)
        uses: ./
        with:
          checksum-file: "true"
          artifact-name: dist-sign-compat

      # The artifact service can answer "not found" for a moment after the upload (see the test job),
      # and the signer downloads the artifact once, so wait until it can be downloaded.
      - name: Wait for the artifact
        id: wait
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-sign-compat
          path: ${{ runner.temp }}/wait-artifact

      - name: Wait before retrying the download
        if: ${{ steps.wait.outcome == 'failure' }}
        shell: bash
        run: sleep 20

      - name: Wait for the artifact (retry)
        if: ${{ steps.wait.outcome == 'failure' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-sign-compat
          path: ${{ runner.temp }}/wait-artifact

      - name: Run sign-pypi-package-action
        id: sign
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@0add3d41c042f2c855d4ac39bfd51e57987ca8fe # ratchet:durandtibo/sign-pypi-package-action@v0.1.1
        with:
          tag-name: sign-compat-test
          dist-artifact-name: dist-sign-compat

      - name: Assert the signer accepted the checksums
        shell: bash
        env:
          FAILED_CHECK: ${{ steps.sign.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failed_check permissions "${FAILED_CHECK}"

  # Edge cases, packages that must be rejected. `expected` is the failed-check id of the check that
  # must fail. The checks do not depend on the OS, so one runner is enough. The rows that set
  # `twine-version` or `twine-exclude-newer` prove that these inputs reach step 1.9: an unknown twine
  # version, and a cutoff date before the release of the default twine, make it fail. An empty
  # input overrides the default of the action, so `twine-version` falls back to the default
  # of action.yaml (keep it in step; an older pin stays valid).
  reject:
    name: reject (${{ matrix.case }})
    needs: cases
    if: ${{ github.ref_type != 'tag' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.cases.outputs.reject) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      - name: Stage an oversized file in the package
        if: matrix.stage == 'oversized'
        shell: bash
        run: |
          source scripts/test-helper.sh
          stage_oversized_file pypi_release_action_fixture

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action (local)
        id: local
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./
        with:
          import-name: ${{ matrix.import-name }}
          twine-version: ${{ matrix.twine-version || '7.0.0' }}
          twine-exclude-newer: ${{ matrix.twine-exclude-newer }}

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action (released)
        id: released
        if: ${{ inputs.use-released }}
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@ade1f9b224bd9bb90b4f551dfe3abbb1409f3782 # ratchet:durandtibo/build-pypi-package-action@v0.1.2
        with:
          import-name: ${{ matrix.import-name }}
          twine-version: ${{ matrix.twine-version || '7.0.0' }}
          twine-exclude-newer: ${{ matrix.twine-exclude-newer }}

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ inputs.use-released && steps.released.outcome || steps.local.outcome }}
          FAILED_CHECK: ${{ steps.local.outputs.failed-check || steps.released.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"

  # Manual runs must publish a pre-release only; the guard is a whitelist, so a post release is rejected too.
  # Only exercised when the workflow is dispatched manually.
  reject-manual:
    name: reject-manual (${{ matrix.case }})
    needs: cases
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.cases.outputs.reject-manual) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action (local)
        id: local
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action (released)
        id: released
        if: ${{ inputs.use-released }}
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@ade1f9b224bd9bb90b4f551dfe3abbb1409f3782 # ratchet:durandtibo/build-pypi-package-action@v0.1.2

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ inputs.use-released && steps.released.outcome || steps.local.outcome }}
          FAILED_CHECK: ${{ steps.local.outputs.failed-check || steps.released.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"

  # The pre-release requirement only applies to manual runs: a plain release version that is not on PyPI must be accepted
  # on any other trigger.
  accept-plain-version-outside-manual-run:
    if: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-plain-version/. .

      - name: Run build-package action (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          artifact-name: dist-accept-plain-version

      - name: Run build-package action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/build-pypi-package-action@ade1f9b224bd9bb90b4f551dfe3abbb1409f3782 # ratchet:durandtibo/build-pypi-package-action@v0.1.2
        with:
          artifact-name: dist-accept-plain-version

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.local.outputs.package-name || steps.released.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.local.outputs.package-version || steps.released.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "9.9.9"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built false

  # The tag must be exactly v + the package version (v0.0.1a1 for the fixture). Only exercised on a tag ref other
  # than that one.
  reject-tag-mismatch:
    name: reject-tag-mismatch (${{ matrix.case }})
    needs: cases
    if: ${{ github.ref_type == 'tag' && github.ref_name != 'v0.0.1a1' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.cases.outputs.reject-tag-mismatch) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action (local)
        id: local
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action (released)
        id: released
        if: ${{ inputs.use-released }}
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@ade1f9b224bd9bb90b4f551dfe3abbb1409f3782 # ratchet:durandtibo/build-pypi-package-action@v0.1.2

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ inputs.use-released && steps.released.outcome || steps.local.outcome }}
          FAILED_CHECK: ${{ steps.local.outputs.failed-check || steps.released.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"
