# Tests the last stable release (durandtibo/build-pypi-package-action@v0.0.2) against the fixture package in
# test/fixtures/pkg, across Linux/macOS/Windows, plus the fixtures in
# test/fixtures/pkg-published, test/fixtures/pkg-plain-version,
# test/fixtures/pkg-build-failure, and test/fixtures/pkg-custom-build-command,
# which exercise its failure paths (already-published version, plain version
# on a manual run, failing build command) and its build-command input. Safe
# to run on every push/PR: it only builds and smoke-tests throwaway packages,
# no publishing or signing involved.

name: Test Stable Action

on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      os_all: ${{ steps.cfg.outputs.os_all }}
    steps:
      - name: Load workflow config
        uses: durandtibo/workflow-config-action@8c406999ac8ac3cafe656c263759d8ddea3a4edb # ratchet:durandtibo/workflow-config-action@v0.2
        id: cfg

  build:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os_all) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # The build-package action assumes the package it builds lives at the
      # repo root (pyproject.toml, Makefile, tasks.py), so stage the fixture
      # there for the duration of this job.
      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        id: build
        uses: durandtibo/build-pypi-package-action@v0.0.2
        with:
          artifact-name: dist-stable-${{ matrix.os }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  custom-build-command:
    # build-package must invoke the command given via the build-command
    # input instead of assuming "inv build-package".
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-custom-build-command/. .

      - name: Run build-package action
        id: build
        uses: durandtibo/build-pypi-package-action@v0.0.2
        with:
          artifact-name: dist-stable-custom-build-command
          build-command: inv custom-build

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  reject-build-failure:
    # build-package must fail closed when the build command itself errors
    # out, before it ever gets to the metadata/publish checks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-build-failure/. .

      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@v0.0.2

      - name: Assert build-package action failed
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (build command errors out)" "${{ steps.build.outcome }}"

  reject-already-published-version:
    # build-package must fail closed when the package name/version it built
    # is already published on PyPI, regardless of how it was triggered.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # This fixture claims to be "requests" 2.31.0, a name/version already
      # published on PyPI, so the action's "already published" check should
      # reject it before it ever gets to the smoke test.
      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-published/. .

      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@v0.0.2

      - name: Assert build-package action failed
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (already-published version)" "${{ steps.build.outcome }}"

  reject-plain-version-on-manual-run:
    # build-package must reject workflow_dispatch runs that target a plain
    # release version instead of a dev/pre-release one. This check is only
    # exercised when this workflow is dispatched manually.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-plain-version/. .

      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@v0.0.2

      - name: Assert build-package action failed
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (manual run, plain release version)" "${{ steps.build.outcome }}"

  verify-artifact:
    needs: [config, build]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os_all) }}
    # Verification just inspects already-built, OS-independent files
    # (wheel/sdist/checksums), so one runner is enough regardless of which
    # OS produced each artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: dist-stable-${{ matrix.os }}
          path: dist/

      - name: Assert dist artifact contains the expected files
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_artifact
