# Nightly workflow testing the last stable release of the action, to catch
# regressions in what consumers pick up. It calls ci-action.yaml with
# use-released: true, so the cases are the same as in ci.yaml (only the rows of
# test/cases.json marked "released": true). The current (unreleased) code is
# tested nightly by ci.yaml.
#
# Permissions are set at the job level, not the workflow level.

name: Nightly Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared OS and Python version matrices from the default config of
  # durandtibo/workflow-config-action once.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Test the last stable release of the action
  test-released:
    needs: get-matrix
    uses: ./.github/workflows/ci-action.yaml
    with:
      use-released: true
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read
