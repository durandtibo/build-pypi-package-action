# Workflow testing the last stable release of the action
# (durandtibo/build-pypi-package-action@v0.1.0), to catch regressions in what
# consumers pick up. It has the same structure and the same assertions as
# ci-action.yaml, which tests the current checkout instead; it differs only in the
# `uses:` ref, the artifact names, and the mode of load-cases.sh: only the rows of
# test/cases.json marked "released": true, i.e. the features that the release has.
# Update the version in this header and in the `uses:` refs below when a new
# version is released, then flip `released` to true for its features in
# test/cases.json.

name: Test Released Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Matrices of the accept and reject jobs, from test/cases.json (the rows with "released": true).
  cases:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accept: ${{ steps.load.outputs.accept }}
      reject: ${{ steps.load.outputs.reject }}
      reject-manual: ${{ steps.load.outputs.reject-manual }}
      reject-tag-mismatch: ${{ steps.load.outputs.reject-tag-mismatch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Load cases
        id: load
        shell: bash
        run: scripts/load-cases.sh released

  # Build the fixture package on every OS (Linux, macOS, Windows)
  build:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # The build-package action assumes the package it builds lives at the
      # repo root, so stage the fixture there for the duration of this job.
      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        id: build
        uses: durandtibo/build-pypi-package-action@239defb64fe09080292442db058bddd02f498eb3 # ratchet:durandtibo/build-pypi-package-action@v0.1.0
        with:
          artifact-name: dist-stable-${{ matrix.os }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # Build the fixture package with every Python version of the config
  build-python:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        id: build
        uses: durandtibo/build-pypi-package-action@239defb64fe09080292442db058bddd02f498eb3 # ratchet:durandtibo/build-pypi-package-action@v0.1.0
        with:
          python-version: ${{ matrix.python-version }}
          artifact-name: dist-stable-python-${{ matrix.python-version }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "0.0.1a1"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # Packages that must build. Each row is a case; `stale` first fills dist/ with stale files, which must
  # be gone afterwards; `import-name` is passed to the action.
  accept:
    name: accept (${{ matrix.case }})
    if: github.ref_type != 'tag'
    needs: cases
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.cases.outputs.accept) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      - name: Create stale files in dist/
        if: matrix.stale
        shell: bash
        run: |
          mkdir dist
          touch dist/stale-0.0.0-py3-none-any.whl dist/stale-0.0.0.tar.gz dist/SHA256SUMS

      - name: Run build-package action
        id: build
        uses: durandtibo/build-pypi-package-action@239defb64fe09080292442db058bddd02f498eb3 # ratchet:durandtibo/build-pypi-package-action@v0.1.0
        with:
          import-name: ${{ matrix.import-name }}
          artifact-name: dist-stable-accept-${{ matrix.case }}

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
          EXPECTED_NAME: ${{ matrix.name }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "${EXPECTED_NAME}" "${EXPECTED_VERSION}"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

      # dist/ content from a previous build must never leak into the artifact.
      - name: Assert stale files are gone
        if: matrix.stale
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_stale_dist_cleared

  # Packages that must be rejected. `expected` is the failed-check id of the check that must fail.
  reject:
    name: reject (${{ matrix.case }})
    if: github.ref_type != 'tag'
    needs: cases
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.cases.outputs.reject) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      - name: Stage an oversized file in the package
        if: matrix.stage == 'oversized'
        shell: bash
        run: |
          source scripts/test-helper.sh
          stage_oversized_file pypi_release_action_fixture

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@239defb64fe09080292442db058bddd02f498eb3 # ratchet:durandtibo/build-pypi-package-action@v0.1.0
        with:
          import-name: ${{ matrix.import-name }}

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"

  # Manual runs must publish a pre-release only; the guard is a whitelist, so a post release is rejected too.
  # Only exercised when the workflow is dispatched manually.
  reject-manual:
    name: reject-manual (${{ matrix.case }})
    if: github.event_name == 'workflow_dispatch'
    needs: cases
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.cases.outputs.reject-manual) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@239defb64fe09080292442db058bddd02f498eb3 # ratchet:durandtibo/build-pypi-package-action@v0.1.0

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"

  # The pre-release requirement only applies to manual runs: a plain release version that is not on PyPI must be accepted
  # on any other trigger.
  accept-plain-version-outside-manual-run:
    if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        run: cp -r test/fixtures/pkg-plain-version/. .

      - name: Run build-package action
        id: build
        uses: durandtibo/build-pypi-package-action@239defb64fe09080292442db058bddd02f498eb3 # ratchet:durandtibo/build-pypi-package-action@v0.1.0
        with:
          artifact-name: dist-stable-accept-plain-version

      - name: Assert extracted metadata matches the fixture
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          source scripts/test-helper.sh
          assert_metadata "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "pypi-release-action-fixture" "9.9.9"

      - name: Assert dist/ was built
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_built

  # The tag must be exactly v + the package version (v0.0.1a1 for the fixture). Only exercised on a tag ref other
  # than that one.
  reject-tag-mismatch:
    name: reject-tag-mismatch (${{ matrix.case }})
    if: github.ref_type == 'tag' && github.ref_name != 'v0.0.1a1'
    needs: cases
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.cases.outputs.reject-tag-mismatch) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: cp -r "test/fixtures/${FIXTURE}/." .

      # The error annotation of this step is expected: the step must fail
      - name: Run build-package action
        id: build
        continue-on-error: true
        uses: durandtibo/build-pypi-package-action@239defb64fe09080292442db058bddd02f498eb3 # ratchet:durandtibo/build-pypi-package-action@v0.1.0

      - name: Assert build-package action failed for the expected reason
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          FAILED_CHECK: ${{ steps.build.outputs.failed-check }}
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
        run: |
          source scripts/test-helper.sh
          assert_failure "build-package (${CASE})" "${OUTCOME}"
          assert_failed_check "${EXPECTED}" "${FAILED_CHECK}"

  # Verification just inspects already-built, OS-independent files (wheel and sdist), so one runner is enough
  # regardless of which OS produced each artifact.
  verify-artifact:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-stable-${{ matrix.os }}
          path: dist/

      - name: Assert dist artifact contains the expected files
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_dist_artifact
