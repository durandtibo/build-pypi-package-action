name: Build PyPI package
description: Builds, validates, and smoke-tests a Python package (sdist + wheel) with uv, then uploads it.

branding:
  icon: package
  color: blue

inputs:
  python-version:
    description: Python version used to build and smoke test the package
    required: false
    default: "3.14"
  artifact-name:
    description: Name of the uploaded distribution artifact
    required: false
    default: "dist"

outputs:
  package-name:
    description: Package name extracted from pyproject.toml
    value: ${{ steps.metadata.outputs.name }}
  package-version:
    description: Package version extracted from pyproject.toml
    value: ${{ steps.metadata.outputs.version }}

runs:
  using: composite
  steps:
    # Install uv package manager
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
      with:
        activate-environment: true
        python-version: ${{ inputs.python-version }}

    # `--clear` empties dist/ first, so stale files from a previous build can
    # never end up in the uploaded artifact.
    - name: Build package
      shell: bash
      run: |
        uv build --clear

    # Fail closed unless exactly one sdist and one wheel were produced:
    # checksums, the smoke test and the upload all assume that.
    - name: Check dist contents
      shell: bash
      run: |
        shopt -s nullglob
        wheels=(dist/*.whl)
        sdists=(dist/*.tar.gz)
        if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one wheel and one sdist in dist/, found ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s)"
          exit 1
        fi

    - name: Check package metadata
      shell: bash
      run: |
        uvx twine check --strict dist/*

    - name: Extract package metadata
      id: metadata
      uses: durandtibo/extract-pyproject-metadata-action@4661b78698e6ceb7e04cf60bbdd52addf85a2889 # ratchet:durandtibo/extract-pyproject-metadata-action@v0.2

    - name: Check manual run uses a dev/pre-release version
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        # Manual runs must never publish a plain release version
        # (e.g. "1.2.3"); only pre-release/dev versions
        # (e.g. "1.2.3a1", "1.2.3.dev1") are allowed. Real releases
        # must go through a "vX.Y.Z" tag push instead.
        if [[ "${PACKAGE_VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
          echo "::error::Manual runs require a dev/pre-release version, got plain release version ${PACKAGE_VERSION}"
          exit 1
        fi

    - name: Check tag matches package version
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        TAG_VERSION: ${{ github.ref_name }}
        PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        # Tag is "vX.Y.Z"; strip the leading "v" before comparing.
        if [[ "${TAG_VERSION#v}" != "${PACKAGE_VERSION}" ]]; then
          echo "::error::Tag ${TAG_VERSION} does not match package version ${PACKAGE_VERSION}"
          exit 1
        fi

    - name: Check version not already published on PyPI
      shell: bash
      env:
        PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
        PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        status=$(curl -s -o /dev/null -w "%{http_code}" \
          "https://pypi.org/pypi/${PACKAGE_NAME}/${PACKAGE_VERSION}/json")
        if [[ "$status" == "200" ]]; then
          echo "::error::${PACKAGE_NAME} ${PACKAGE_VERSION} is already published on PyPI"
          exit 1
        fi

    # Install each artifact into a throwaway environment without the project
    # and import it in isolated mode (-I), so the source tree cannot mask a
    # broken artifact (e.g. a flat-layout package missing from the wheel).
    - name: Smoke test built distributions
      shell: bash
      env:
        PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        # Distribution names may contain hyphens/dots (PEP 503), but the
        # importable module name uses underscores instead.
        MODULE_NAME=$(echo "${PACKAGE_NAME}" | tr '.-' '_')
        for artifact in dist/*.whl dist/*.tar.gz; do
          echo "Smoke testing ${artifact}"
          uv run --isolated --no-project --python "${PYTHON_VERSION}" --with "${artifact}" \
            -- python -I -c "import importlib; importlib.import_module('${MODULE_NAME}')"
        done

    - name: Generate checksums
      shell: bash
      run: |
        cd dist
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -- *.tar.gz *.whl > SHA256SUMS
        else
          shasum -a 256 -- *.tar.gz *.whl > SHA256SUMS
        fi

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/
        retention-days: 5
