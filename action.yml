name: Build PyPI package
description: Builds, validates, and smoke-tests a Python package (sdist + wheel) with uv, then uploads it.

branding:
  icon: package
  color: blue

inputs:
  python-version:
    description: Python version used to build and smoke test the package
    required: false
    default: "3.14"
  artifact-name:
    description: Name of the uploaded distribution artifact
    required: false
    default: "dist"
  import-name:
    description: Module imported by the smoke test (default is detected from the wheel)
    required: false
    default: ""

outputs:
  package-name:
    description: Name field of the built wheel's metadata
    value: ${{ steps.metadata.outputs.name }}
  package-version:
    description: Normalized version of the built wheel
    value: ${{ steps.metadata.outputs.version }}
  # Diagnostic: id of the check that failed, empty on success. Only one step can
  # fail, so at most one of these is set.
  failed-check:
    description: Name of the failed check (empty on success), for diagnostics and tests
    value: >-
      ${{ steps.build.outputs.failed-check || steps.dist-contents.outputs.failed-check
      || steps.twine.outputs.failed-check || steps.manual-version.outputs.failed-check
      || steps.tag.outputs.failed-check || steps.published.outputs.failed-check
      || steps.import.outputs.failed-check || steps.smoke-wheel.outputs.failed-check
      || steps.smoke-sdist.outputs.failed-check }}

runs:
  using: composite
  steps:
    # ---- 0.x Setup ----------------------------------------------------------
    # No cache (a release build must neither consume nor write one) and no
    # activated virtual environment (uv build / uv run / uvx do not need one).
    # python-version sets UV_PYTHON for every later uv call.
    - name: 0.1 Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: false

    # Composite steps cannot share shell functions, so write the failure helper
    # once. fail <check-id> <title> <what happened and why> <how to fix>
    - name: 0.2 Define failure helper
      shell: bash
      run: |
        cat > "${RUNNER_TEMP}/fail.sh" <<'EOF'
        fail() {
          echo "failed-check=$1" >> "$GITHUB_OUTPUT"
          echo "::error title=$2::$3 How to fix: $4"
          printf '### :x: %s\n\n%s\n\n**How to fix:** %s\n' "$2" "$3" "$4" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }
        EOF

    # ---- 1.x Build and package checks ---------------------------------------
    # --clear: no stale files from earlier builds. --no-sources: ignore
    # [tool.uv.sources] so the build matches what PyPI users get.
    - name: 1.1 Build package
      id: build
      shell: bash
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        uv build --clear --no-sources --out-dir dist ||
          fail build "Build failed" "uv build failed (output above); nothing was uploaded." \
            "Run uv build locally; the error comes from the build backend, not from this action."

    - name: 1.2 Check dist contents
      id: dist-contents
      shell: bash
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        shopt -s nullglob
        files=(dist/*) wheels=(dist/*.whl) sdists=(dist/*.tar.gz)
        [[ ${#files[@]} -eq 2 && ${#wheels[@]} -eq 1 && ${#sdists[@]} -eq 1 ]] ||
          fail dist-contents "Unexpected files in dist/" \
            "Found ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s); dist/ holds: ${files[*]:-nothing}. Exactly one of each is required." \
            "Check [build-system] and that no other step writes to dist/."

    # twine is pinned: an unpinned version makes a release build depend on
    # whatever is newest. Bump it with the quarterly review (see CLAUDE.md).
    - name: 1.3 Check package metadata
      id: twine
      shell: bash
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        uvx twine@7.0.0 check --strict dist/* ||
          fail twine "Invalid package metadata" \
            "twine check --strict rejected the metadata (output above); PyPI would reject or misrender it." \
            "Fix the readme, description or classifiers named above; run uvx twine check --strict dist/* locally."

    # Name and version come from the wheel that will be uploaded, not from a
    # second parser of pyproject.toml, so static and dynamic versions behave alike.
    # canonical-name is the PEP 503 form used for the PyPI lookup. module is the
    # import name: top_level.txt if present, else the first top-level package
    # (directory with __init__.py), else the first top-level .py file, else "-".
    - name: 1.4 Read package metadata
      id: metadata
      shell: bash
      run: |
        read -r name version canonical module < <(uv run --no-project python -I - dist/*.whl <<'PY' | tr -d '\r'
        import re, sys, zipfile
        from email.parser import Parser
        with zipfile.ZipFile(sys.argv[1]) as z:
            names = sorted(z.namelist())
            meta = Parser().parsestr(z.read(next(n for n in names if n.endswith(".dist-info/METADATA"))).decode())
            top = next((n for n in names if n.endswith(".dist-info/top_level.txt")), None)
            pkgs = [n.split("/")[0] for n in names if n.count("/") == 1 and n.endswith("/__init__.py")]
            mods = [n[:-3] for n in names if "/" not in n and n.endswith(".py")]
            found = (z.read(top).decode().split() if top else []) + pkgs + mods
        print(meta["Name"], meta["Version"], re.sub(r"[-_.]+", "-", meta["Name"]).lower(), found[0] if found else "-")
        PY
        )
        { echo "name=${name}"; echo "version=${version}"; echo "canonical-name=${canonical}"; echo "module=${module}"; } >> "$GITHUB_OUTPUT"

    # ---- 2.x Release guards -------------------------------------------------
    # Whitelist: a manual run must publish a pre-release (aN, bN, rcN, .devN).
    # The version comes from the wheel, so it is already PEP 440 normalized.
    # The local segment (+...) is stripped first so it cannot fake a pre-release.
    - name: 2.1 Check manual run uses a pre-release version
      id: manual-version
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        pattern='(a|b|rc)[0-9]+|\.dev[0-9]+'
        base="${VERSION%%+*}"
        base="${base%%.post*}"
        [[ "${VERSION%%+*}" =~ ${pattern} ]] ||
          fail manual-version "Version not allowed on manual run" \
            "Event is workflow_dispatch and ${VERSION} is not a pre-release." \
            "Use a pre-release version (e.g. ${base}a1 or ${base}.dev1), or publish by pushing the tag v${VERSION}."

    # Rule: the tag must be exactly "v" + the normalized version.
    - name: 2.2 Check tag matches version
      id: tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
        VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        [[ "${TAG}" == "v${VERSION}" ]] ||
          fail tag "Tag does not match version" \
            "Tag is ${TAG}, package version is ${VERSION}; the tag must be exactly v${VERSION}." \
            "Change the version in pyproject.toml, or delete the tag and create v${VERSION}."

    # Only a 404 proves "not published"; a 200 is a duplicate and any other
    # answer (network error -> 000, 429, 5xx) fails closed.
    - name: 2.3 Check version not already on PyPI
      id: published
      shell: bash
      env:
        NAME: ${{ steps.metadata.outputs.canonical-name }}
        VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        status=$(curl --silent --show-error --max-time 20 --retry 3 --output /dev/null \
          --write-out '%{http_code}' "https://pypi.org/pypi/${NAME}/${VERSION}/json" || true)
        case "${status}" in
          404) ;;
          200) fail published "Version already on PyPI" \
                 "${NAME} ${VERSION} exists on PyPI, which never allows re-uploading a version." \
                 "Bump the version and, for a tag push, create a new tag." ;;
          *)   fail published "Cannot verify against PyPI" \
                 "PyPI answered HTTP ${status} for ${NAME} ${VERSION}; failing closed instead of guessing." \
                 "Re-run the job; check https://status.python.org if it persists." ;;
        esac

    # ---- 3.x Smoke tests ----------------------------------------------------
    # The explicit import-name input wins over the module detected from the wheel.
    - name: 3.1 Resolve import name
      id: import
      shell: bash
      env:
        MODULE: ${{ inputs.import-name || steps.metadata.outputs.module }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        [[ "${MODULE}" != "-" ]] ||
          fail import "Import name not detected" \
            "The wheel has no top_level.txt, no package directory and no top-level module, so the module to import is unknown." \
            "Set the import-name input."
        echo "module=${MODULE}" >> "$GITHUB_OUTPUT"

    # Install each artifact into a throwaway environment without the project
    # and import it in isolated mode (-I), so the source tree cannot mask a
    # broken artifact (e.g. a flat-layout package missing from the wheel).
    - name: 3.2 Smoke test wheel
      id: smoke-wheel
      shell: bash
      env:
        MODULE: ${{ steps.import.outputs.module }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        uv run --isolated --no-project --with dist/*.whl -- python -I -c "import os, importlib; importlib.import_module(os.environ['MODULE'])" ||
          fail smoke-wheel "Distribution cannot be imported" \
            "Installing the wheel into a clean environment and importing ${MODULE} failed (output above)." \
            "Check that the wheel contains the package (unzip -l dist/*.whl), or set import-name if ${MODULE} is the wrong name."

    - name: 3.3 Smoke test sdist
      id: smoke-sdist
      shell: bash
      env:
        MODULE: ${{ steps.import.outputs.module }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        uv run --isolated --no-project --with dist/*.tar.gz -- python -I -c "import os, importlib; importlib.import_module(os.environ['MODULE'])" ||
          fail smoke-sdist "Distribution cannot be imported" \
            "Building the sdist in a clean environment and importing ${MODULE} failed (output above)." \
            "Check that the sdist contains the sources and build files (tar tzf dist/*.tar.gz), or set import-name if ${MODULE} is the wrong name."

    # ---- 4.x Report and upload ----------------------------------------------
    - name: 4.1 Generate checksums
      shell: bash
      run: |
        cd dist
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -- *.tar.gz *.whl > SHA256SUMS
        else
          shasum -a 256 -- *.tar.gz *.whl > SHA256SUMS
        fi

    - name: 4.2 Write job summary
      shell: bash
      env:
        NAME: ${{ steps.metadata.outputs.name }}
        VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        printf '### :white_check_mark: %s %s\n\nBuilt and checked: %s\n' \
          "${NAME}" "${VERSION}" "$(ls dist | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

    - name: 4.3 Upload distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/
        retention-days: 5
        if-no-files-found: error
