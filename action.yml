name: Build PyPI package
description: Builds, validates, and smoke-tests a Python package (sdist + wheel) with uv, then uploads it.

branding:
  icon: package
  color: blue

inputs:
  python-version:
    description: Python version used to build and smoke test the package
    required: false
    default: "3.14"
  artifact-name:
    description: Name of the uploaded distribution artifact
    required: false
    default: "dist"
  import-name:
    description: Module imported by the smoke test (default is resolved from the wheel; the action fails if that is ambiguous)
    required: false
    default: ""
  uv-version:
    description: Version of uv to install (the default is the one this action release was tested with)
    required: false
    default: "0.13.7" # bump with twine, quarterly, in its own PR (see CLAUDE.md)
  twine-version:
    description: Version of twine used by twine check
    required: false
    default: "7.0.0"
  twine-exclude-newer:
    description: >-
      Date (YYYY-MM-DD) after which published packages are ignored when resolving twine and its
      dependencies, so twine check is reproducible; empty to disable (needed for a newer twine-version)
    required: false
    default: "2026-11-01"

outputs:
  package-name:
    description: Name field of the built wheel's metadata
    value: ${{ steps.inspect.outputs.name }}
  package-version:
    description: Normalized version of the built wheel
    value: ${{ steps.inspect.outputs.version }}
  # Diagnostic, set by the last step: the id passed to fail, or "unexpected" when
  # a step outside the checks failed (setup, upload).
  failed-check:
    description: Id of the failed check, "unexpected" if another step failed, empty on success
    value: ${{ steps.report.outputs.failed-check }}

runs:
  using: composite
  steps:
    # ---- 0.x Setup ----------------------------------------------------------
    # No cache (a release build must neither consume nor write one) and no
    # activated virtual environment (uv build / uv run / uvx do not need one).
    # python-version sets UV_PYTHON for every later uv call.
    - name: 0.1 Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: false

    # Composite steps cannot share shell functions, so write the failure helper
    # once. fail <check-id> <title> <what happened and why> <how to fix>
    # The id goes to a file read by step 4.3, so a check needs no output
    # declaration. rm -f: a second use of the action in the same job must not
    # read a stale id. Annotation text escapes % and line breaks (file names
    # reach the message).
    - name: 0.2 Define failure helper
      shell: bash
      run: |
        rm -f "${RUNNER_TEMP}/failed-check"
        cat > "${RUNNER_TEMP}/fail.sh" <<'EOF'
        fail() {
          echo "$1" > "${RUNNER_TEMP}/failed-check"
          local msg="$3 How to fix: $4"
          local cr=$'\r' lf=$'\n'
          msg="${msg//%/%25}"; msg="${msg//${cr}/%0D}"; msg="${msg//${lf}/%0A}"
          echo "::error title=$2::${msg}"
          printf '### :x: %s\n\n%s\n\n**How to fix:** %s\n' "$2" "$3" "$4" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }
        EOF

    # ---- 1.x Build and package checks ---------------------------------------
    # --clear: no stale files from earlier builds. --no-sources: ignore
    # [tool.uv.sources] so the build matches what PyPI users get.
    - name: 1.1 Build package
      shell: bash
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        uv build --clear --no-sources --out-dir dist ||
          fail build "Build failed" "uv build failed (output above); nothing was uploaded." \
            "Run uv build locally; the error comes from the build backend, or set python-version to one the package supports (requires-python)."

    - name: 1.2 Check dist contents
      shell: bash
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        shopt -s nullglob
        files=(dist/*) wheels=(dist/*.whl) sdists=(dist/*.tar.gz)
        [[ ${#files[@]} -eq 2 && ${#wheels[@]} -eq 1 && ${#sdists[@]} -eq 1 ]] ||
          fail dist-contents "Unexpected files in dist/" \
            "Found ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s); dist/ holds: ${files[*]:-nothing}. Exactly one of each is required." \
            "Check [build-system] and that no other step writes to dist/."

    # Facts only, no verdict: every later check of 1.x reads these outputs, so the
    # wheel and the sdist are opened once. Name and version come from the wheel
    # that will be uploaded, not from a second parser of pyproject.toml, so static
    # and dynamic versions behave alike.
    #   canonical-name  PEP 503 form, used for the PyPI lookup
    #   missing         required metadata fields the wheel lacks
    #   unwanted        files that must never ship (secrets, VCS data, caches);
    #                   example files such as .env.example are allowed
    #   candidates      top-level packages (directories with __init__.py) and
    #                   modules (.py files) of the wheel, for the import name
    # Names are sanitized (no newline) so a file name cannot forge an output line.
    - name: 1.3 Inspect distributions
      id: inspect
      shell: bash
      run: |
        uv run --no-project python -I - dist/*.whl dist/*.tar.gz <<'PY' | tr -d '\r' >> "$GITHUB_OUTPUT"
        import re, sys, tarfile, zipfile
        from email.parser import Parser
        BAD = re.compile(r"(^|/)(\.env(\.(?!example$|sample$|template$)[^/]*)?|\.git|\.pypirc|id_(rsa|ed25519)|[^/]*\.pem|__pycache__|\.DS_Store)(/|$)|\.pyc$")
        canon = lambda n: re.sub(r"[-_.]+", "-", n).lower()
        with zipfile.ZipFile(sys.argv[1]) as z:
            names = sorted(z.namelist())
            meta = Parser().parsestr(z.read(next(n for n in names if n.endswith(".dist-info/METADATA"))).decode())
            tops = {n.split("/")[0] for n in names if n.count("/") == 1 and n.endswith("/__init__.py")}
            tops |= {n[:-3] for n in names if "/" not in n and n.endswith(".py")}
        with tarfile.open(sys.argv[2]) as t:
            sdist = t.getnames()
        clean = lambda n: n.replace("\n", "?")
        print(f"name={meta['Name']}\nversion={meta['Version']}\ncanonical-name={canon(meta['Name'])}")
        print("missing=" + ",".join(k for k in ("Summary", "Requires-Python") if not meta[k]))
        print("unwanted=" + ",".join(sorted({clean(n) for n in names + sdist if BAD.search(n)})))
        print("candidates=" + ",".join(sorted(clean(n) for n in tops)))
        PY

    # Metadata PyPI and installers rely on: without Requires-Python pip installs the
    # package on Python versions it does not support; without Summary the project
    # page is blank.
    - name: 1.4 Check required metadata fields
      shell: bash
      env:
        MISSING: ${{ steps.inspect.outputs.missing }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        [[ -z "${MISSING}" ]] ||
          fail metadata-fields "Required metadata missing" "The wheel has no: ${MISSING//,/, }." \
            "Set description and requires-python in [project] of pyproject.toml."

    # Fail closed: the module to smoke test is never guessed. Order: the import-name
    # input; else the wheel's top-level names (private "_x" names dropped when a
    # public one remains); of those, the one named like the distribution; else the
    # only one; else fail and list them.
    - name: 1.5 Resolve import name
      id: import
      shell: bash
      env:
        IMPORT_NAME: ${{ inputs.import-name }}
        CANDIDATES: ${{ steps.inspect.outputs.candidates }}
        CANONICAL_NAME: ${{ steps.inspect.outputs.canonical-name }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        IFS=, read -ra c <<< "${CANDIDATES}"
        pick="${IMPORT_NAME}"
        if [[ -z "${pick}" ]]; then
          public=()
          for m in "${c[@]}"; do [[ "${m}" == _* ]] || public+=("${m}"); done
          if (( ${#public[@]} )); then c=("${public[@]}"); fi
          for m in "${c[@]}"; do [[ "${m}" == "${CANONICAL_NAME//-/_}" ]] && pick="${m}"; done
          if [[ -z "${pick}" && ${#c[@]} -eq 1 ]]; then pick="${c[0]}"; fi
        fi
        [[ -n "${pick}" ]] ||
          fail import "Import name is ambiguous" \
            "Top-level modules in the wheel: ${CANDIDATES//,/, }; none is the only one or matches ${CANONICAL_NAME}." \
            "Set the import-name input."
        echo "module=${pick}" >> "$GITHUB_OUTPUT"

    - name: 1.6 Check no unwanted files are packaged
      shell: bash
      env:
        UNWANTED: ${{ steps.inspect.outputs.unwanted }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        [[ -z "${UNWANTED}" ]] ||
          fail unwanted-files "Unwanted files in the package" "Found: ${UNWANTED//,/, }" \
            "Exclude them in the build backend config (e.g. hatch exclude, MANIFEST.in) and rotate any leaked secret."

    # PyPI rejects files over 100 MiB by default; fail here instead of at upload time.
    - name: 1.7 Check file sizes
      shell: bash
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        for f in dist/*; do
          size=$(wc -c < "${f}")
          (( size <= 100 * 1024 * 1024 )) ||
            fail size "File too large for PyPI" "${f} is ${size} bytes; PyPI's default limit is 100 MiB." \
              "Exclude data and build artifacts from the package, or request a limit increase from PyPI."
        done

    # A platform-specific wheel built on one runner does not cover the other
    # platforms. Warn only: compiled packages are legitimate.
    - name: 1.8 Warn on platform-specific wheel
      shell: bash
      run: |
        wheel=$(basename dist/*.whl)
        [[ "${wheel}" == *-none-any.whl ]] ||
          echo "::warning title=Platform-specific wheel::${wheel} only installs on one platform; build the other platforms separately."

    # Last of 1.x: it needs a download, so the cheap local checks fail first.
    # twine and its dependencies are pinned: twine@x.y.z fixes twine itself and
    # --exclude-newer fixes what its dependencies (requests, readme-renderer, ...)
    # resolve to, so twine check is reproducible. The flag is scoped to twine: it
    # must not restrict the package's own build requirements. Bump the three
    # defaults with the quarterly review (see CLAUDE.md).
    - name: 1.9 Check package metadata
      shell: bash
      env:
        TWINE_VERSION: ${{ inputs.twine-version }}
        EXCLUDE_NEWER: ${{ inputs.twine-exclude-newer }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        args=()
        [[ -z "${EXCLUDE_NEWER}" ]] || args=(--exclude-newer "${EXCLUDE_NEWER}")
        uvx ${args[@]+"${args[@]}"} "twine@${TWINE_VERSION}" check --strict dist/* ||
          fail twine "Invalid package metadata" \
            "twine check --strict rejected the metadata (output above); PyPI would reject or misrender it." \
            "Fix the readme, description or classifiers named above; run uvx twine check --strict dist/* locally."

    # ---- 2.x Release guards -------------------------------------------------
    # PyPI rejects local versions ("1.2.3+abc"), typical of setuptools-scm on
    # untagged commits.
    - name: 2.1 Check version has no local segment
      shell: bash
      env:
        VERSION: ${{ steps.inspect.outputs.version }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        [[ "${VERSION}" != *+* ]] ||
          fail local-version "Local version cannot be published" \
            "${VERSION} has a local segment (+...), which PyPI rejects." \
            "Build from a tagged commit, or configure the version scheme to drop local versions."

    # Whitelist: a manual run must publish a pre-release (aN, bN, rcN, .devN).
    # The version comes from the wheel, so it is already PEP 440 normalized.
    # The local segment (+...) is stripped first so it cannot fake a pre-release.
    - name: 2.2 Check manual run uses a pre-release version
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        VERSION: ${{ steps.inspect.outputs.version }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        pattern='(a|b|rc)[0-9]+|\.dev[0-9]+'
        base="${VERSION%%+*}"
        base="${base%%.post*}"
        [[ "${VERSION%%+*}" =~ ${pattern} ]] ||
          fail manual-version "Version not allowed on manual run" \
            "Event is workflow_dispatch and ${VERSION} is not a pre-release." \
            "Use a pre-release version (e.g. ${base}a1 or ${base}.dev1), or publish by pushing the tag v${VERSION}."

    # Rule: the tag must be exactly "v" + the normalized version.
    - name: 2.3 Check tag matches version
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
        VERSION: ${{ steps.inspect.outputs.version }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        [[ "${TAG}" == "v${VERSION}" ]] ||
          fail tag "Tag does not match version" \
            "Tag is ${TAG}, package version is ${VERSION}; the tag must be exactly v${VERSION}." \
            "Change the version in pyproject.toml, or delete the tag and create v${VERSION}."

    # Only a 404 proves "not published"; a 200 is a duplicate and any other
    # answer (network error -> 000, 429, 5xx) fails closed.
    - name: 2.4 Check version not already on PyPI
      shell: bash
      env:
        NAME: ${{ steps.inspect.outputs.canonical-name }}
        VERSION: ${{ steps.inspect.outputs.version }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        status=$(curl --silent --show-error --max-time 20 --retry 3 --output /dev/null \
          --write-out '%{http_code}' "https://pypi.org/pypi/${NAME}/${VERSION}/json" || true)
        case "${status}" in
          404) ;;
          200) fail published "Version already on PyPI" \
                 "${NAME} ${VERSION} exists on PyPI, which never allows re-uploading a version." \
                 "Bump the version and, for a tag push, create a new tag." ;;
          *)   fail published "Cannot verify against PyPI" \
                 "PyPI answered HTTP ${status} for ${NAME} ${VERSION}; failing closed instead of guessing." \
                 "Re-run the job; check https://status.python.org if it persists." ;;
        esac

    # ---- 3.x Smoke tests ----------------------------------------------------
    # Install each artifact into a throwaway environment without the project
    # and import it in isolated mode (-I), so the source tree cannot mask a
    # broken artifact (e.g. a flat-layout package missing from the wheel).
    - name: 3.1 Smoke test wheel
      shell: bash
      env:
        MODULE: ${{ steps.import.outputs.module }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        uv run --isolated --no-project --with dist/*.whl -- python -I -c "import os, importlib; importlib.import_module(os.environ['MODULE'])" ||
          fail smoke-wheel "Distribution cannot be imported" \
            "Installing the wheel into a clean environment and importing ${MODULE} failed (output above)." \
            "Check that the wheel contains the package (unzip -l dist/*.whl), or set import-name if ${MODULE} is the wrong name."

    # Every declared entry point (console scripts, plugins) must resolve to an
    # importable object: a typo there installs fine and fails only when the user
    # runs the command.
    - name: 3.2 Smoke test entry points
      shell: bash
      env:
        NAME: ${{ steps.inspect.outputs.name }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        uv run --isolated --no-project --with dist/*.whl -- python -I -c "import os; from importlib.metadata import distribution; [ep.load() for ep in distribution(os.environ['NAME']).entry_points]" ||
          fail entry-points "Entry point cannot be loaded" \
            "An entry point of ${NAME} failed to load (output above)." \
            "Check the [project.scripts] and [project.entry-points] targets for typos and import errors."

    # ---- 4.x Report and upload ----------------------------------------------
    - name: 4.1 Write job summary
      shell: bash
      env:
        NAME: ${{ steps.inspect.outputs.name }}
        VERSION: ${{ steps.inspect.outputs.version }}
      run: |
        printf '### :white_check_mark: %s %s\n\nBuilt and checked: %s\n' \
          "${NAME}" "${VERSION}" "$(ls dist | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

    - name: 4.2 Upload distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/
        retention-days: 5
        compression-level: 0 # wheels and sdists are already compressed
        if-no-files-found: error

    # Last step, runs only when a step above failed. The id written by fail, or
    # "unexpected" when the failure did not come from a check.
    - name: 4.3 Report failed check
      id: report
      if: failure()
      shell: bash
      run: echo "failed-check=$(cat "${RUNNER_TEMP}/failed-check" 2>/dev/null || echo unexpected)" >> "$GITHUB_OUTPUT"
