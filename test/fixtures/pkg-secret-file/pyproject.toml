[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypi-release-action-fixture"
version = "0.0.1a1"
description = "Throwaway fixture that force-includes a .env file, used to test that unwanted files are rejected."
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["pypi_release_action_fixture"]

[tool.hatch.build.targets.wheel.force-include]
# Packaged as ".env" (the source has another name so that .gitignore does not hide it).
"dotenv-fixture.txt" = "pypi_release_action_fixture/.env"
