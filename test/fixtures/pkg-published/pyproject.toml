[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "requests"
version = "2.34.0.dev1"
description = "Throwaway fixture package that reuses a pre-release name/version already published on PyPI (a pre-release so that manual runs reach the duplicate check), used to test that build-package rejects re-publishing an existing version."
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["requests"]
