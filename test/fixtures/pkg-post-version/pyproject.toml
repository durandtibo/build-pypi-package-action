[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypi-release-action-fixture"
version = "9.9.9.post1"
description = "Throwaway fixture package with a post-release version, used to test that the manual-run guard is a whitelist: a post release is not a pre-release."
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["pypi_release_action_fixture"]
