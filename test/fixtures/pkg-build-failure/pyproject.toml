[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypi-release-action-fixture"
version = "0.0.1a1"
description = "Throwaway fixture package whose build task always fails, used to test that build-package fails closed on a broken build command."
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["pypi_release_action_fixture"]
