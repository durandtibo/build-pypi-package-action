[build-system]
requires = ["hatchling"]
# Deliberately names a backend that does not exist, so `uv build` fails for every
# version of the build tooling.
build-backend = "does_not_exist.build"

[project]
name = "pypi-release-action-fixture"
version = "0.0.1a1"
description = "Throwaway fixture package whose build always fails, used to test that build-package fails closed on a broken build."
readme = "README.md"
requires-python = ">=3.10"
