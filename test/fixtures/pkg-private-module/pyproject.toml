[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypi-release-action-fixture-private"
version = "0.0.1a1"
description = "Throwaway fixture with a private package that sorts first and cannot be imported next to one public package, used to test that private names are skipped."
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["_helper", "public_api"]
